# guard.conf — the owner's switches for the guardrails. Protected path (law 7):
# changing a line here needs OWNER-CONFIRMED, like CLAUDE.md does.
#
# ledger_gate — how os/decisions.md is gated (os/scripts/lib/guard.sh reads it).
#   append-only   template default: appending `**Status:** draft` entries passes
#                 freely; editing an existing line, or a new entry that already
#                 claims `**Status:** confirmed`, needs OWNER-CONFIRMED.
#   off           the ledger commits freely, drafts and confirmations alike. Law 2
#                 still governs it on the record: write the owner's words verbatim
#                 into the entry or its commit message.
# A missing file or an unknown value reads as append-only — a typo fails closed.
ledger_gate=append-only
